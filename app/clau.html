<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Clau d'OpenAI · Subtítols IMESDE</title>
<style>
  :root { --cream: #f4f3ef; --ink: #2b2b2b; --soft: #62625e; --green: #bce12a; --green-deep: #a3c414; --red: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink); font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--ink); color: var(--green); padding: 18px 26px; font-size: 12.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  main { padding: 22px 26px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 14px; color: var(--soft); font-size: 14px; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(43,43,43,.2); background: #fff; font: 15px ui-monospace, Menlo, monospace; outline: none; }
  input:focus { border-color: var(--green-deep); }
  .row { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  button { border: 0; border-radius: 999px; padding: 11px 24px; font: 600 15px "Helvetica Neue", Arial, sans-serif; cursor: pointer; }
  .go { background: var(--green); color: var(--ink); }
  .go:disabled { opacity: .5; cursor: default; }
  .ghost { background: transparent; border: 1px solid rgba(43,43,43,.3); }
  #msg { margin-top: 14px; font-size: 14px; min-height: 21px; }
  #msg.err { color: var(--red); font-weight: 600; }
  #msg.ok { color: #5f7207; font-weight: 600; }
  small { display: block; margin-top: 16px; color: var(--soft); font-size: 12.5px; }
</style>
</head>
<body>
<header>Subtítols IMESDE · clau d'OpenAI</header>
<main>
  <h1>Enganxa la clau d'OpenAI</h1>
  <p>Es desa <b>xifrada al Clauer de macOS</b> d'aquest Mac i no es torna a ensenyar mai. No queda en cap fitxer de text.</p>
  <input id="k" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" autofocus>
  <div class="row">
    <button class="go" id="go">Comprovar i desar</button>
    <button class="ghost" id="force" hidden>Desar-la igualment</button>
    <button class="ghost" id="cancel">Cancel·lar</button>
  </div>
  <div id="msg"></div>
  <small>Recomanat: una clau d'un projecte d'OpenAI només per als subtítols, amb límit de despesa.</small>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  async function save(force) {
    const key = $('k').value.trim();
    if (!/^sk-[\w-]{20,}$/.test(key)) { $('msg').className = 'err'; $('msg').textContent = 'Això no sembla una clau d’OpenAI (comença per «sk-»).'; return; }
    $('go').disabled = true; $('msg').className = ''; $('msg').textContent = force ? 'Desant…' : 'Comprovant amb OpenAI…';
    const r = await window.clau.desa(key, !!force);
    $('go').disabled = false;
    $('msg').className = r.ok ? 'ok' : 'err';
    $('msg').textContent = r.msg;
    $('force').hidden = !r.offline;
  }
  $('go').onclick = () => save(false);
  $('force').onclick = () => save(true);
  $('cancel').onclick = () => window.clau.cancel();
  $('k').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(false); });
</script>
</body>
</html>
